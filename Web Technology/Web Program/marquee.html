<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee</title>
</head>
<body>
   
    <marquee direction="down" width="2000px" height="100px" bgcolor="blue" behavior="alternate" hspace="100px" vspace="10px" loop="blank"  scrolldelay="200"> Helo my name is samdhi</marquee>
    <marquee direction="up" width="2000px"  height="100px" bgcolor="yellow" behavior="scroll" hspace="200px"  vspace="20px" loop="12" scrollamount="10"> Helo my name is samdhi</marquee>
    <marquee direction="left" width="2000px" height="100px" bgcolor="green" behavior="slide" hspace="300px" vspace="30px"> Helo my name is samdhi</marquee>
    <marquee direction="right" width="2000px" height="100px" bgcolor="red" align="top"> Helo my name is samdhi</marquee>
     <div style= "border:1px solid red">
        <marquee direction="right" width="2000px" vspace="100px"  height="200px" bgcolor="red" align="top"> Helo my name is samdhi</marquee>
</div>
</body>
</html>
