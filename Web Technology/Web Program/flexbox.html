<style>

.card{
    width: 100px;
    height:100px;
    margin: 2px;
    text-align:center;
    background-color: lightcoral;
    border: 2px solid blue;
}
.aontainer{
        display:flex;
        flex-direction: row;
        /* justify-content: space-around; */
        align-items:stretch;
        flex-wrap: no wrap;
        gap: 5px;
    }
.bontainer{
        display:flex;
        flex-direction:row;
        /* justify-content: flex-end; */
        align-items: flex-start;
    }
.container{
        display:flex;
        flex-direction:column;
        /* justify-content: center; */
         align-items: flex-end;
    }
.dontainer{
        display:flex;
        flex-direction:row;
        /* justify-content:space-between; */
         align-items: center;
    }
      
.eontainer{
        display:flex;
        flex-direction:column;
        /* justify-content:space-evenly; */
        text-align: baseline;
    }
